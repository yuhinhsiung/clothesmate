name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform and build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Run lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt

      - name: Capture build diagnostics
        if: failure()
        run: |
          ./gradlew assembleDebug --stacktrace > ci-build.log 2>&1 || true
          git config user.name "ci-diagnostics"
          git config user.email "ci-diagnostics@users.noreply.github.com"
          git checkout -B ci-diagnostics
          git add ci-build.log
          git commit -m "ci: capture build diagnostics" || true
          git push origin ci-diagnostics --force

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clothesmate-debug
          if-no-files-found: error
          path: app/build/outputs/apk/debug/app-debug.apk
